[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellinspector"
version = "1.2.0"
description = "Mobile Device Security Auditor via ADB"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Sud4k" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
keywords = ["android", "security", "adb", "auditor", "spyware", "pegasus", "stalkerware"]
dependencies = [
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/Sud4ka/CellInspector"
Repository = "https://github.com/Sud4ka/CellInspector"
Issues = "https://github.com/Sud4ka/CellInspector/issues"

[project.scripts]
cellinspector = "cellinspector:main"

[tool.setuptools.packages.find]
include = ["core*", "modules*"]
